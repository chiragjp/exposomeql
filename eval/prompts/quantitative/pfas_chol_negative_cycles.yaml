id: quant_pfas_chol_negative_cycles
category: quantitative
prompt: |
  In which specific NHANES cycles does PFOA (LBXPFOA) show a NEGATIVE
  within-cycle association with total cholesterol (LBXTC)? List the cycle
  letters or year ranges explicitly — no ranges or hedging.
expected:
  cycles: ["C", "D", "E", "F"]
  years: ["2003-2004", "2005-2006", "2007-2008", "2009-2010"]
deterministic_checks:
  required_terms:
    # Require at least one explicit cycle letter or year range AND the word "negative".
    - "(\\b[CDEF]\\b|200[3-9]-20[01][02]|2003-2004|2005-2006|2007-2008|2009-2010)"
    - "(negative|inverse|below zero|<\\s*0)"
    - "(PFOA|LBXPFOA)"
    - "(cholesterol|LBXTC)"
  forbidden_terms:
    - "(approximately|I don'?t have|cannot determine)"
rubric:
  - names_specific_cycles
  - identifies_within_cycle_negative_pattern
  - supports_simpsons_interpretation
